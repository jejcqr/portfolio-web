name: PDF et guide des explications

# Régénère docs/EXPLICATIONS.pdf et le guide interactif docs/guide/index.html dès que
# le Markdown (ou leur mise en page) change, puis les commite sur la branche.
on:
  push:
    branches: [main]
    paths:
      - docs/EXPLICATIONS.md
      - docs/pdf.css
      - docs/generer-pdf.sh
      - docs/generer-guide.sh
      - docs/guide-src/**
  workflow_dispatch:

# Minimum par défaut ; seul le job pdf, qui commite les fichiers générés, peut écrire.
permissions:
  contents: read

jobs:
  pdf:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Installer pandoc et WeasyPrint
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc fonts-dejavu
          pip install weasyprint

      - name: Générer le PDF
        run: bash docs/generer-pdf.sh

      - name: Générer le guide interactif
        run: bash docs/generer-guide.sh

      - name: Commiter les fichiers générés s'ils ont changé
        run: |
          git add docs/EXPLICATIONS.pdf docs/guide/index.html
          if git diff --cached --quiet; then
            echo "PDF et guide inchangés"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git commit -m "Régénère le PDF et le guide de la fiche explicative"
          git push
