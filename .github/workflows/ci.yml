name: Tests et déploiement

on:
  push:
  pull_request:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Tests unitaires (filtres et données)
        run: npm test
      - run: npx playwright install --with-deps chromium
      - name: Tests de bout en bout (ordinateur et mobile)
        run: npm run test:e2e

  deploiement:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: tests
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Préparation du site
        run: mkdir _site && cp -r index.html css js data _site/
      - uses: actions/upload-pages-artifact@v3
      - id: deploiement
        uses: actions/deploy-pages@v4
